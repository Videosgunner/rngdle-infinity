<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RNGdle Unlimited - Roll infinite random numbers, collect badges, and compete with friends!">
    <title>RNGdle Unlimited</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --trash: #6b7280;
            --common: #10b981;
            --uncommon: #3b82f6;
            --rare: #a855f7;
            --epic: #f59e0b;
            --anomaly: #ef4444;
            --mythic: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #1a1f35 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 2px solid var(--primary);
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            flex: 1;
            min-width: 150px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-top: 5px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .game-section {
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--surface-light);
        }

        .roll-button {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .roll-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .roll-button:active {
            transform: translateY(0);
        }

        .number-display {
            text-align: center;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-value {
            font-size: 3.5em;
            font-weight: bold;
            color: var(--primary);
            font-family: 'Monaco', monospace;
        }

        .rarity-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .rarity-item {
            padding: 15px;
            border-radius: 8px;
            background: var(--surface-light);
            text-align: center;
        }

        .rarity-name {
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .rarity-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .badges-section {
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--surface-light);
        }

        .badges-section h2 {
            margin-bottom: 20px;
            color: var(--primary);
        }

        .badge {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 10px;
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.75em;
            text-align: center;
            padding: 5px;
        }

        .badge:hover {
            transform: scale(1.1);
        }

        .badge-tooltip {
            display: none;
            position: absolute;
            background: var(--surface-light);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            z-index: 1000;
            border: 1px solid var(--primary);
            margin-top: -50px;
        }

        .badge-container {
            position: relative;
            display: inline-block;
        }

        .badge-container:hover .badge-tooltip {
            display: block;
        }

        .trash { background: var(--trash); border-color: var(--trash); }
        .common { background: var(--common); border-color: var(--common); }
        .uncommon { background: var(--uncommon); border-color: var(--uncommon); }
        .rare { background: var(--rare); border-color: var(--rare); }
        .epic { background: var(--epic); border-color: var(--epic); }
        .anomaly { background: var(--anomaly); border-color: var(--anomaly); }
        .mythic { background: var(--mythic); border-color: var(--mythic); color: #000; }

        .earned-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .collection-section {
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--surface-light);
            margin-top: 30px;
        }

        .collection-section h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .collection-badge {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .collection-badge:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .collection-badge.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .collection-badge.locked:hover {
            transform: none;
        }

        .badge-emoji {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .badge-name {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .badge-count {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .history-section {
            background: var(--surface);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid var(--surface-light);
            margin-top: 30px;
        }

        .history-section h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: var(--surface-light);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-number {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
            font-family: 'Monaco', monospace;
        }

        .history-meta {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .clear-button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .clear-button:hover {
            background: #be185d;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-size: 1.2em;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 RNGdle Unlimited</h1>
            <p class="subtitle">Roll infinite random numbers and collect badges!</p>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalRolls">0</div>
                <div class="stat-label">Total Rolls</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalEP">0</div>
                <div class="stat-label">Total EP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="badgesCollected">0</div>
                <div class="stat-label">Badges Collected</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uniqueBadges">0</div>
                <div class="stat-label">Unique Badges</div>
            </div>
        </div>

        <div class="main-content">
            <div class="game-section">
                <button class="roll-button" onclick="rollNumber()">🎲 ROLL</button>
                <div class="loading" id="loading">Rolling...</div>
                
                <div class="number-display" id="numberDisplay" style="display: none;">
                    <div class="number-value" id="numberValue">0</div>
                </div>

                <div id="analysisSection" style="display: none;">
                    <div class="rarity-info">
                        <div class="rarity-item">
                            <div class="rarity-name">Rarity</div>
                            <div class="rarity-value" id="rarityDisplay">—</div>
                        </div>
                        <div class="rarity-item">
                            <div class="rarity-name">Entropy Points</div>
                            <div class="rarity-value" id="epDisplay">0</div>
                        </div>
                    </div>

                    <div class="badges-section">
                        <h2>Badges Earned This Roll</h2>
                        <div class="earned-badges" id="earnedBadges">No badges earned</div>
                    </div>
                </div>
            </div>

            <div class="badges-section">
                <h2>Collection Progress</h2>
                <div style="margin-bottom: 20px;">
                    <div style="color: var(--text-secondary); margin-bottom: 10px;" id="collectionProgress">0 / 0</div>
                    <div style="background: var(--surface-light); height: 10px; border-radius: 5px; overflow: hidden;">
                        <div style="background: linear-gradient(90deg, var(--primary), var(--secondary)); height: 100%; width: 0%;" id="progressBar"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="collection-section">
            <h2>🏆 Badge Collection</h2>
            <div class="badge-grid" id="badgeCollection"></div>
        </div>

        <div class="history-section">
            <h2>📜 Roll History</h2>
            <div class="history-list" id="historyList">No rolls yet</div>
            <button class="clear-button" onclick="clearHistory()">Clear History</button>
        </div>
    </div>

    <script>
        // Badge definitions
        const BADGES = {
            prime: {
                name: "Prime Time",
                emoji: "🔢",
                rarity: "uncommon",
                description: "A prime number",
                check: (n) => isPrime(n)
            },
            palindrome: {
                name: "Palindrome",
                emoji: "🔄",
                rarity: "uncommon",
                description: "Reads the same forwards and backwards",
                check: (n) => isPalindrome(n)
            },
            perfect_square: {
                name: "Perfect Square",
                emoji: "📦",
                rarity: "rare",
                description: "A perfect square number",
                check: (n) => isPerfectSquare(n)
            },
            perfect_cube: {
                name: "Perfect Cube",
                emoji: "🎲",
                rarity: "rare",
                description: "A perfect cube number",
                check: (n) => isPerfectCube(n)
            },
            fibonacci: {
                name: "Fibonacci",
                emoji: "🌀",
                rarity: "epic",
                description: "Part of the Fibonacci sequence",
                check: (n) => isFibonacci(n)
            },
            power_of_two: {
                name: "Power of Two",
                emoji: "⚡",
                rarity: "rare",
                description: "A power of 2",
                check: (n) => isPowerOfTwo(n)
            },
            repeating_digits: {
                name: "Repeating",
                emoji: "🔁",
                rarity: "uncommon",
                description: "Has repeating digits",
                check: (n) => hasRepeatingDigits(n)
            },
            all_same_digit: {
                name: "All Same",
                emoji: "🌟",
                rarity: "epic",
                description: "All digits are the same",
                check: (n) => allSameDigits(n)
            },
            meme_number: {
                name: "Meme Number",
                emoji: "😂",
                rarity: "rare",
                description: "A famous meme number",
                check: (n) => isMemeNumber(n)
            },
            lucky_number: {
                name: "Lucky 7",
                emoji: "🍀",
                rarity: "uncommon",
                description: "Contains or is divisible by 7",
                check: (n) => n % 7 === 0 || n.toString().includes('7')
            },
            lucky_number_8: {
                name: "Lucky 8",
                emoji: "∞",
                rarity: "uncommon",
                description: "Contains or is divisible by 8",
                check: (n) => n % 8 === 0 || n.toString().includes('8')
            },
            ascending_digits: {
                name: "Ascending",
                emoji: "📈",
                rarity: "epic",
                description: "Digits in ascending order",
                check: (n) => isAscendingDigits(n)
            },
            descending_digits: {
                name: "Descending",
                emoji: "📉",
                rarity: "epic",
                description: "Digits in descending order",
                check: (n) => isDescendingDigits(n)
            },
            zero_included: {
                name: "Zero Hero",
                emoji: "0️⃣",
                rarity: "uncommon",
                description: "Contains the digit 0",
                check: (n) => n.toString().includes('0')
            },
            all_odd: {
                name: "Odd Squad",
                emoji: "🤪",
                rarity: "rare",
                description: "All digits are odd",
                check: (n) => {
                    const digits = n.toString().split('');
                    return digits.length > 1 && digits.every(d => parseInt(d) % 2 === 1);
                }
            },
            all_even: {
                name: "Even Steven",
                emoji: "🎯",
                rarity: "rare",
                description: "All digits are even",
                check: (n) => {
                    const digits = n.toString().split('');
                    return digits.length > 1 && digits.every(d => parseInt(d) % 2 === 0);
                }
            },
            triangular: {
                name: "Triangular",
                emoji: "△",
                rarity: "epic",
                description: "A triangular number",
                check: (n) => isTriangular(n)
            },
            perfect_number: {
                name: "Perfect",
                emoji: "✨",
                rarity: "mythic",
                description: "A perfect number (rare!)",
                check: (n) => isPerfectNumber(n)
            },
            round_number: {
                name: "Round Number",
                emoji: "⭕",
                rarity: "common",
                description: "Ends in zeros",
                check: (n) => n > 0 && n % 100 === 0
            },
            one_million: {
                name: "Million Dollar",
                emoji: "💰",
                rarity: "mythic",
                description: "You rolled 1,000,000!",
                check: (n) => n === 1000000
            }
        };

        // Math functions
        function isPrime(n) {
            if (n < 2) return false;
            if (n === 2) return true;
            if (n % 2 === 0) return false;
            for (let i = 3; i <= Math.sqrt(n); i += 2) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function isPalindrome(n) {
            const str = n.toString();
            return str === str.split('').reverse().join('');
        }

        function isPerfectSquare(n) {
            const root = Math.sqrt(n);
            return root === Math.floor(root) && n > 1;
        }

        function isPerfectCube(n) {
            const root = Math.cbrt(n);
            return root === Math.floor(root) && n > 1;
        }

        function isFibonacci(n) {
            let a = 0, b = 1;
            while (a < n) {
                [a, b] = [b, a + b];
            }
            return a === n;
        }

        function isPowerOfTwo(n) {
            return n > 0 && (n & (n - 1)) === 0;
        }

        function hasRepeatingDigits(n) {
            const digits = n.toString();
            return new Set(digits).size < digits.length;
        }

        function allSameDigits(n) {
            const digits = n.toString();
            return digits.length > 1 && new Set(digits).size === 1;
        }

        function isMemeNumber(n) {
            const memes = [42, 69, 420, 666, 777, 888, 999, 1337, 4200, 6969];
            return memes.includes(n);
        }

        function isAscendingDigits(n) {
            const digits = n.toString().split('').map(Number);
            if (digits.length < 2) return false;
            for (let i = 1; i < digits.length; i++) {
                if (digits[i] <= digits[i - 1]) return false;
            }
            return true;
        }

        function isDescendingDigits(n) {
            const digits = n.toString().split('').map(Number);
            if (digits.length < 2) return false;
            for (let i = 1; i < digits.length; i++) {
                if (digits[i] >= digits[i - 1]) return false;
            }
            return true;
        }

        function isTriangular(n) {
            const x = (Math.sqrt(1 + 8 * n) - 1) / 2;
            return x === Math.floor(x) && n > 0;
        }

        function isPerfectNumber(n) {
            const perfectNumbers = [6, 28, 496, 8128];
            return perfectNumbers.includes(n);
        }

        // Game logic
        let gameData = {
            rolls: [],
            badgeCollection: {},
            totalEP: 0
        };

        function loadGameData() {
            const saved = localStorage.getItem('rngdleData');
            if (saved) {
                gameData = JSON.parse(saved);
            }
            initializeBadgeCollection();
            updateUI();
        }

        function initializeBadgeCollection() {
            Object.keys(BADGES).forEach(badgeId => {
                if (!gameData.badgeCollection[badgeId]) {
                    gameData.badgeCollection[badgeId] = 0;
                }
            });
        }

        function saveGameData() {
            localStorage.setItem('rngdleData', JSON.stringify(gameData));
        }

        function rollNumber() {
            const button = document.querySelector('.roll-button');
            button.disabled = true;
            document.getElementById('loading').classList.add('active');

            // Simulate rolling animation
            setTimeout(() => {
                const number = Math.floor(Math.random() * 1000001);
                analyzeNumber(number);
                document.getElementById('loading').classList.remove('active');
                button.disabled = false;
            }, 500);
        }

        function analyzeNumber(number) {
            // Check badges
            const earnedBadgeIds = [];
            Object.entries(BADGES).forEach(([id, badge]) => {
                if (badge.check(number)) {
                    earnedBadgeIds.push(id);
                }
            });

            // Calculate EP
            let ep = calculateEP(number, earnedBadgeIds);

            // Add to roll history
            gameData.rolls.unshift({
                number: number,
                timestamp: new Date().toLocaleString(),
                badges: earnedBadgeIds,
                ep: ep,
                rarity: getRarity(ep)
            });

            // Keep last 50 rolls
            if (gameData.rolls.length > 50) {
                gameData.rolls = gameData.rolls.slice(0, 50);
            }

            // Update badge collection
            earnedBadgeIds.forEach(badgeId => {
                gameData.badgeCollection[badgeId]++;
            });

            gameData.totalEP += ep;
            saveGameData();
            displayRoll(number, earnedBadgeIds, ep);
            updateUI();
        }

        function calculateEP(number, badgeIds) {
            let ep = 0;
            badgeIds.forEach(badgeId => {
                const badgeRarities = {
                    'common': 10,
                    'uncommon': 25,
                    'rare': 50,
                    'epic': 100,
                    'anomaly': 250,
                    'mythic': 500
                };
                ep += badgeRarities[BADGES[badgeId].rarity];
            });
            return ep;
        }

        function getRarity(ep) {
            if (ep >= 500) return 'Mythic';
            if (ep >= 250) return 'Anomaly';
            if (ep >= 100) return 'Epic';
            if (ep >= 50) return 'Rare';
            if (ep >= 25) return 'Uncommon';
            if (ep >= 10) return 'Common';
            return 'Trash';
        }

        function displayRoll(number, badgeIds, ep) {
            document.getElementById('numberDisplay').style.display = 'flex';
            document.getElementById('numberValue').textContent = number.toLocaleString();
            document.getElementById('analysisSection').style.display = 'block';
            document.getElementById('rarityDisplay').textContent = getRarity(ep);
            document.getElementById('epDisplay').textContent = ep;

            // Display earned badges
            const badgesHTML = badgeIds.length > 0 
                ? badgeIds.map(id => `
                    <div class="badge-container">
                        <div class="badge ${BADGES[id].rarity}">
                            ${BADGES[id].emoji}<br>${BADGES[id].name}
                        </div>
                        <div class="badge-tooltip">${BADGES[id].description}</div>
                    </div>
                `).join('')
                : 'No badges earned this roll';
            
            document.getElementById('earnedBadges').innerHTML = badgesHTML;

            // Scroll to results
            setTimeout(() => {
                document.querySelector('.rarity-info').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        function updateUI() {
            document.getElementById('totalRolls').textContent = gameData.rolls.length;
            document.getElementById('totalEP').textContent = gameData.totalEP.toLocaleString();

            let totalBadges = 0;
            let uniqueBadges = 0;
            Object.values(gameData.badgeCollection).forEach(count => {
                if (count > 0) uniqueBadges++;
                totalBadges += count;
            });

            document.getElementById('badgesCollected').textContent = totalBadges;
            document.getElementById('uniqueBadges').textContent = uniqueBadges;

            // Update progress bar
            const progress = (uniqueBadges / Object.keys(BADGES).length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('collectionProgress').textContent = `${uniqueBadges} / ${Object.keys(BADGES).length}`;

            // Update badge collection
            renderBadgeCollection();

            // Update history
            renderHistory();
        }

        function renderBadgeCollection() {
            const container = document.getElementById('badgeCollection');
            container.innerHTML = Object.entries(BADGES).map(([id, badge]) => {
                const count = gameData.badgeCollection[id];
                const locked = count === 0;
                return `
                    <div class="collection-badge ${badge.rarity} ${locked ? 'locked' : ''}">
                        <div class="badge-emoji">${badge.emoji}</div>
                        <div class="badge-name">${badge.name}</div>
                        <div class="badge-count">${count > 0 ? `×${count}` : '?'}</div>
                    </div>
                `;
            }).join('');
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (gameData.rolls.length === 0) {
                container.innerHTML = 'No rolls yet';
                return;
            }

            container.innerHTML = gameData.rolls.map((roll, idx) => `
                <div class="history-item">
                    <div>
                        <div class="history-number">#${roll.number.toLocaleString()}</div>
                        <div class="history-meta">${roll.timestamp} • ${roll.rarity} • ${roll.badges.length} badge${roll.badges.length !== 1 ? 's' : ''}</div>
                    </div>
                    <div style="color: var(--primary); font-weight: bold; font-size: 1.2em;">+${roll.ep} EP</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all data? This cannot be undone.')) {
                gameData = { rolls: [], badgeCollection: {}, totalEP: 0 };
                initializeBadgeCollection();
                saveGameData();
                updateUI();
                document.getElementById('numberDisplay').style.display = 'none';
                document.getElementById('analysisSection').style.display = 'none';
            }
        }

        // Initialize
        loadGameData();
    </script>
</body>
</html>
