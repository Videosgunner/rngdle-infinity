<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RNGdle Unlimited - Roll infinite random numbers and collect badges!">
    <title>RNGdle Unlimited</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg: #0a0e27;
            --surface: #131829;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --common: #10b981;
            --uncommon: #3b82f6;
            --rare: #a855f7;
            --epic: #f59e0b;
            --anomaly: #ef4444;
            --mythic: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: slideDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.8em;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.95em;
            font-weight: 400;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-container {
            background: var(--surface);
            border-radius: 20px;
            padding: 60px 40px;
            margin-bottom: 50px;
            animation: slideUp 0.6s ease-out 0.1s both;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .roll-button {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            display: block;
            padding: 18px 40px;
            font-size: 1.1em;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .roll-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .roll-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .roll-button:active {
            transform: translateY(-1px);
        }

        .roll-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .number-display {
            text-align: center;
            margin: 50px 0 40px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-in 0.5s ease-out;
        }

        @keyframes pulse-in {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .number-value {
            font-size: 4.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .rarity-display {
            text-align: center;
            margin: 30px 0;
            animation: fadeIn 0.4s ease-out 0.2s both;
        }

        .rarity-label {
            font-size: 0.85em;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .rarity-value {
            font-size: 1.8em;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badges-earned {
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            animation: fadeIn 0.4s ease-out 0.3s both;
        }

        .badge-earned {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 12px;
            border: 2px solid;
            font-weight: 600;
            font-size: 0.7em;
            cursor: pointer;
            position: relative;
            animation: badgePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes badgePop {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        .badge-earned:hover {
            transform: scale(1.1);
        }

        .badge-earned .badge-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75em;
            white-space: nowrap;
            border: 1px solid var(--primary);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            margin-bottom: 8px;
        }

        .badge-earned:hover .badge-tooltip {
            opacity: 1;
        }

        .rarity-common { background: var(--common); border-color: var(--common); }
        .rarity-uncommon { background: var(--uncommon); border-color: var(--uncommon); }
        .rarity-rare { background: var(--rare); border-color: var(--rare); }
        .rarity-epic { background: var(--epic); border-color: var(--epic); }
        .rarity-anomaly { background: var(--anomaly); border-color: var(--anomaly); }
        .rarity-mythic { background: var(--mythic); border-color: var(--mythic); color: #000; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        .stat {
            background: var(--surface);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .collection {
            background: var(--surface);
            border-radius: 20px;
            padding: 50px 40px;
            margin-bottom: 50px;
            animation: slideUp 0.6s ease-out 0.3s both;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.6em;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.4s ease;
            border-radius: 3px;
        }

        .progress-text {
            font-size: 0.9em;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }

        .badge-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid;
            min-height: 110px;
            position: relative;
        }

        .badge-card:hover:not(.locked) {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .badge-card.locked {
            opacity: 0.35;
            cursor: default;
        }

        .badge-emoji {
            font-size: 2.2em;
            margin-bottom: 8px;
        }

        .badge-name {
            font-weight: 600;
            font-size: 0.8em;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .badge-count {
            font-size: 0.75em;
            opacity: 0.8;
        }

        .history {
            background: var(--surface);
            border-radius: 20px;
            padding: 50px 40px;
            animation: slideUp 0.6s ease-out 0.4s both;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s ease;
            border-left: 3px solid var(--primary);
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .history-number {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }

        .history-meta {
            font-size: 0.85em;
            color: var(--text-dim);
        }

        .history-ep {
            color: var(--primary);
            font-weight: 600;
        }

        .clear-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 25px;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
        }

        @media (max-width: 640px) {
            .game-container, .collection, .history {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2.2em;
            }

            .number-value {
                font-size: 3em;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .badge-grid {
                grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 RNGdle Unlimited</h1>
            <p class="subtitle">Roll infinite numbers. Collect badges. No limits.</p>
        </header>

        <div class="game-container">
            <button class="roll-button" onclick="rollNumber()">🎲 Roll</button>
            
            <div id="resultSection" style="display: none;">
                <div class="number-display">
                    <div class="number-value" id="numberValue">0</div>
                </div>

                <div class="rarity-display">
                    <div class="rarity-label">Rarity</div>
                    <div class="rarity-value" id="rarityDisplay">—</div>
                </div>

                <div class="badges-earned" id="earnedBadges"></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalRolls">0</div>
                <div class="stat-label">Total Rolls</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalEP">0</div>
                <div class="stat-label">Entropy Points</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="uniqueBadges">0</div>
                <div class="stat-label">Badges Found</div>
            </div>
        </div>

        <div class="collection">
            <div class="section-title">🏆 Badge Collection</div>
            <div class="progress-text" id="collectionProgress">0 / 0</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="badge-grid" id="badgeCollection"></div>
        </div>

        <div class="history">
            <div class="section-title">📜 Recent Rolls</div>
            <div class="history-list" id="historyList">No rolls yet</div>
            <button class="clear-btn" onclick="clearHistory()">Clear All</button>
        </div>
    </div>

    <script>
        // Badge definitions (30+ badges)
        const BADGES = {
            prime: {
                name: "Prime Time",
                emoji: "🔢",
                rarity: "uncommon",
                description: "A prime number",
                check: (n) => isPrime(n)
            },
            palindrome: {
                name: "Palindrome",
                emoji: "🔄",
                rarity: "uncommon",
                description: "Reads same backwards",
                check: (n) => isPalindrome(n)
            },
            perfect_square: {
                name: "Perfect Square",
                emoji: "📦",
                rarity: "rare",
                description: "A perfect square",
                check: (n) => isPerfectSquare(n)
            },
            perfect_cube: {
                name: "Perfect Cube",
                emoji: "🎲",
                rarity: "rare",
                description: "A perfect cube",
                check: (n) => isPerfectCube(n)
            },
            fibonacci: {
                name: "Fibonacci",
                emoji: "🌀",
                rarity: "epic",
                description: "Fibonacci sequence",
                check: (n) => isFibonacci(n)
            },
            power_of_two: {
                name: "Power of Two",
                emoji: "⚡",
                rarity: "rare",
                description: "A power of 2",
                check: (n) => isPowerOfTwo(n)
            },
            repeating_digits: {
                name: "Repeating",
                emoji: "🔁",
                rarity: "uncommon",
                description: "Has repeating digits",
                check: (n) => hasRepeatingDigits(n)
            },
            all_same_digit: {
                name: "All Same",
                emoji: "🌟",
                rarity: "epic",
                description: "All digits identical",
                check: (n) => allSameDigits(n)
            },
            meme_number: {
                name: "Meme Number",
                emoji: "😂",
                rarity: "rare",
                description: "Famous meme number",
                check: (n) => isMemeNumber(n)
            },
            lucky_seven: {
                name: "Lucky 7",
                emoji: "🍀",
                rarity: "uncommon",
                description: "Has 7 in it",
                check: (n) => n.toString().includes('7') || n % 7 === 0
            },
            lucky_eight: {
                name: "Lucky 8",
                emoji: "∞",
                rarity: "uncommon",
                description: "Has 8 in it",
                check: (n) => n.toString().includes('8') || n % 8 === 0
            },
            ascending_digits: {
                name: "Ascending",
                emoji: "📈",
                rarity: "epic",
                description: "Digits go up",
                check: (n) => isAscendingDigits(n)
            },
            descending_digits: {
                name: "Descending",
                emoji: "📉",
                rarity: "epic",
                description: "Digits go down",
                check: (n) => isDescendingDigits(n)
            },
            contains_zero: {
                name: "Zero Hero",
                emoji: "0️⃣",
                rarity: "uncommon",
                description: "Contains 0",
                check: (n) => n.toString().includes('0')
            },
            all_odd: {
                name: "Odd Squad",
                emoji: "🤪",
                rarity: "rare",
                description: "All odd digits",
                check: (n) => allOddDigits(n)
            },
            all_even: {
                name: "Even Steven",
                emoji: "🎯",
                rarity: "rare",
                description: "All even digits",
                check: (n) => allEvenDigits(n)
            },
            triangular: {
                name: "Triangular",
                emoji: "△",
                rarity: "epic",
                description: "Triangular number",
                check: (n) => isTriangular(n)
            },
            perfect_number: {
                name: "Perfect",
                emoji: "✨",
                rarity: "mythic",
                description: "Perfect number",
                check: (n) => isPerfectNumber(n)
            },
            round_number: {
                name: "Round",
                emoji: "⭕",
                rarity: "common",
                description: "Ends in zeros",
                check: (n) => n > 0 && n % 100 === 0
            },
            one_million: {
                name: "Jackpot",
                emoji: "💰",
                rarity: "mythic",
                description: "1,000,000!",
                check: (n) => n === 1000000
            },
            armstrong: {
                name: "Armstrong",
                emoji: "💎",
                rarity: "epic",
                description: "Sum of digit powers",
                check: (n) => isArmstrong(n)
            },
            harshad: {
                name: "Harshad",
                emoji: "➗",
                rarity: "uncommon",
                description: "Divisible by digit sum",
                check: (n) => isHarshad(n)
            },
            happy_number: {
                name: "Happy",
                emoji: "😊",
                rarity: "rare",
                description: "Happy number",
                check: (n) => isHappy(n)
            },
            power_of_three: {
                name: "Triple Power",
                emoji: "3️⃣",
                rarity: "rare",
                description: "Power of 3",
                check: (n) => isPowerOfThree(n)
            },
            power_of_five: {
                name: "Five Squared",
                emoji: "5️⃣",
                rarity: "rare",
                description: "Power of 5",
                check: (n) => isPowerOfFive(n)
            },
            sum_to_ten: {
                name: "Sum to 10",
                emoji: "➕",
                rarity: "uncommon",
                description: "Digits sum to 10",
                check: (n) => digitSum(n) === 10
            },
            digital_root_nine: {
                name: "Digit 9",
                emoji: "9️⃣",
                rarity: "rare",
                description: "Digital root is 9",
                check: (n) => digitalRoot(n) === 9
            },
            double_digit: {
                name: "Double",
                emoji: "2️⃣",
                rarity: "uncommon",
                description: "Exactly 2 digits",
                check: (n) => n >= 10 && n < 100
            },
            triple_digit: {
                name: "Triple",
                emoji: "3️⃣",
                rarity: "uncommon",
                description: "Exactly 3 digits",
                check: (n) => n >= 100 && n < 1000
            },
            five_digit: {
                name: "Five Figures",
                emoji: "🔢",
                rarity: "rare",
                description: "Exactly 5 digits",
                check: (n) => n >= 10000 && n < 100000
            },
            catalan: {
                name: "Catalan",
                emoji: "🎪",
                rarity: "epic",
                description: "Catalan number",
                check: (n) => isCatalan(n)
            },
            kaprekar: {
                name: "Kaprekar",
                emoji: "🎭",
                rarity: "epic",
                description: "Kaprekar number",
                check: (n) => isKaprekar(n)
            },
            narcissistic: {
                name: "Narcissistic",
                emoji: "🪞",
                rarity: "epic",
                description: "Sum of power of digits",
                check: (n) => isNarcissistic(n)
            }
        };

        // Math functions
        function isPrime(n) {
            if (n < 2) return false;
            if (n === 2) return true;
            if (n % 2 === 0) return false;
            for (let i = 3; i <= Math.sqrt(n); i += 2) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function isPalindrome(n) {
            const str = n.toString();
            return str === str.split('').reverse().join('');
        }

        function isPerfectSquare(n) {
            const root = Math.sqrt(n);
            return root === Math.floor(root) && n > 1;
        }

        function isPerfectCube(n) {
            const root = Math.cbrt(n);
            return root === Math.floor(root) && n > 1;
        }

        function isFibonacci(n) {
            let a = 0, b = 1;
            while (a < n) {
                [a, b] = [b, a + b];
            }
            return a === n;
        }

        function isPowerOfTwo(n) {
            return n > 0 && (n & (n - 1)) === 0;
        }

        function isPowerOfThree(n) {
            if (n < 1) return false;
            while (n % 3 === 0) n /= 3;
            return n === 1;
        }

        function isPowerOfFive(n) {
            if (n < 1) return false;
            while (n % 5 === 0) n /= 5;
            return n === 1;
        }

        function hasRepeatingDigits(n) {
            const digits = n.toString();
            return new Set(digits).size < digits.length;
        }

        function allSameDigits(n) {
            const digits = n.toString();
            return digits.length > 1 && new Set(digits).size === 1;
        }

        function allOddDigits(n) {
            const digits = n.toString().split('');
            return digits.length > 1 && digits.every(d => parseInt(d) % 2 === 1);
        }

        function allEvenDigits(n) {
            const digits = n.toString().split('');
            return digits.length > 1 && digits.every(d => parseInt(d) % 2 === 0);
        }

        function isMemeNumber(n) {
            const memes = [42, 69, 420, 666, 777, 888, 999, 1337, 4200, 6969, 80085];
            return memes.includes(n);
        }

        function isAscendingDigits(n) {
            const digits = n.toString().split('').map(Number);
            if (digits.length < 2) return false;
            for (let i = 1; i < digits.length; i++) {
                if (digits[i] <= digits[i - 1]) return false;
            }
            return true;
        }

        function isDescendingDigits(n) {
            const digits = n.toString().split('').map(Number);
            if (digits.length < 2) return false;
            for (let i = 1; i < digits.length; i++) {
                if (digits[i] >= digits[i - 1]) return false;
            }
            return true;
        }

        function isTriangular(n) {
            const x = (Math.sqrt(1 + 8 * n) - 1) / 2;
            return x === Math.floor(x) && n > 0;
        }

        function isPerfectNumber(n) {
            const perfectNumbers = [6, 28, 496, 8128];
            return perfectNumbers.includes(n);
        }

        function digitSum(n) {
            return n.toString().split('').reduce((a, b) => a + parseInt(b), 0);
        }

        function digitalRoot(n) {
            while (n >= 10) {
                n = digitSum(n);
            }
            return n;
        }

        function isArmstrong(n) {
            const digits = n.toString().split('').map(Number);
            const sum = digits.reduce((acc, d) => acc + Math.pow(d, digits.length), 0);
            return sum === n;
        }

        function isHarshad(n) {
            return n % digitSum(n) === 0;
        }

        function isHappy(n) {
            const seen = new Set();
            while (n !== 1 && !seen.has(n)) {
                seen.add(n);
                n = n.toString().split('').reduce((acc, d) => acc + parseInt(d) ** 2, 0);
            }
            return n === 1;
        }

        function isCatalan(n) {
            const catalan = [1, 1, 2, 5, 14, 42, 132, 429, 1430, 4862, 16796, 58786, 208012, 742900];
            return catalan.includes(n);
        }

        function isKaprekar(n) {
            if (n === 1) return true;
            const squared = (n * n).toString();
            const len = n.toString().length;
            const left = parseInt(squared.slice(0, -len) || '0');
            const right = parseInt(squared.slice(-len));
            return left + right === n;
        }

        function isNarcissistic(n) {
            const digits = n.toString().split('').map(Number);
            const sum = digits.reduce((acc, d) => acc + Math.pow(d, digits.length), 0);
            return sum === n;
        }

        // Game logic
        let gameData = {
            rolls: [],
            badgeCollection: {},
            totalEP: 0
        };

        function loadGameData() {
            const saved = localStorage.getItem('rngdleData');
            if (saved) {
                gameData = JSON.parse(saved);
            }
            initializeBadgeCollection();
            updateUI();
        }

        function initializeBadgeCollection() {
            Object.keys(BADGES).forEach(badgeId => {
                if (!gameData.badgeCollection[badgeId]) {
                    gameData.badgeCollection[badgeId] = 0;
                }
            });
        }

        function saveGameData() {
            localStorage.setItem('rngdleData', JSON.stringify(gameData));
        }

        function rollNumber() {
            const button = document.querySelector('.roll-button');
            button.disabled = true;

            setTimeout(() => {
                const number = Math.floor(Math.random() * 1000001);
                analyzeNumber(number);
                button.disabled = false;
            }, 300);
        }

        function analyzeNumber(number) {
            const earnedBadgeIds = [];
            Object.entries(BADGES).forEach(([id, badge]) => {
                if (badge.check(number)) {
                    earnedBadgeIds.push(id);
                }
            });

            let ep = calculateEP(earnedBadgeIds);

            gameData.rolls.unshift({
                number: number,
                timestamp: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                badges: earnedBadgeIds,
                ep: ep,
                rarity: getRarity(ep)
            });

            if (gameData.rolls.length > 50) {
                gameData.rolls = gameData.rolls.slice(0, 50);
            }

            earnedBadgeIds.forEach(badgeId => {
                gameData.badgeCollection[badgeId]++;
            });

            gameData.totalEP += ep;
            saveGameData();
            displayRoll(number, earnedBadgeIds, ep);
            updateUI();
        }

        function calculateEP(badgeIds) {
            let ep = 0;
            const rarityValues = {
                'common': 10,
                'uncommon': 25,
                'rare': 50,
                'epic': 100,
                'anomaly': 250,
                'mythic': 500
            };
            badgeIds.forEach(badgeId => {
                ep += rarityValues[BADGES[badgeId].rarity];
            });
            return ep;
        }

        function getRarity(ep) {
            if (ep >= 500) return 'Mythic';
            if (ep >= 250) return 'Anomaly';
            if (ep >= 100) return 'Epic';
            if (ep >= 50) return 'Rare';
            if (ep >= 25) return 'Uncommon';
            if (ep >= 10) return 'Common';
            return 'Trash';
        }

        function displayRoll(number, badgeIds, ep) {
            const resultSection = document.getElementById('resultSection');
            document.getElementById('numberValue').textContent = number.toLocaleString();
            document.getElementById('rarityDisplay').textContent = getRarity(ep);

            const badgesHTML = badgeIds.length > 0 
                ? badgeIds.map(id => `
                    <div class="badge-earned rarity-${BADGES[id].rarity}">
                        <div style="font-size: 1.6em;">${BADGES[id].emoji}</div>
                        <div class="badge-tooltip">${BADGES[id].description}</div>
                    </div>
                `).join('')
                : '<div style="color: var(--text-dim); font-size: 0.9em;">No badges this roll</div>';
            
            document.getElementById('earnedBadges').innerHTML = badgesHTML;
            resultSection.style.display = 'block';

            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function updateUI() {
            document.getElementById('totalRolls').textContent = gameData.rolls.length;
            document.getElementById('totalEP').textContent = gameData.totalEP.toLocaleString();

            let uniqueBadges = 0;
            Object.values(gameData.badgeCollection).forEach(count => {
                if (count > 0) uniqueBadges++;
            });

            document.getElementById('uniqueBadges').textContent = uniqueBadges;

            const progress = (uniqueBadges / Object.keys(BADGES).length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('collectionProgress').textContent = `${uniqueBadges} / ${Object.keys(BADGES).length}`;

            renderBadgeCollection();
            renderHistory();
        }

        function renderBadgeCollection() {
            const container = document.getElementById('badgeCollection');
            container.innerHTML = Object.entries(BADGES).map(([id, badge]) => {
                const count = gameData.badgeCollection[id];
                const locked = count === 0;
                return `
                    <div class="badge-card rarity-${badge.rarity} ${locked ? 'locked' : ''}">
                        <div class="badge-emoji">${badge.emoji}</div>
                        <div class="badge-name">${badge.name}</div>
                        <div class="badge-count">${count > 0 ? `×${count}` : '🔒'}</div>
                    </div>
                `;
            }).join('');
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            if (gameData.rolls.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 30px;">No rolls yet</div>';
                return;
            }

            container.innerHTML = gameData.rolls.map((roll) => `
                <div class="history-item">
                    <div style="flex: 1;">
                        <div class="history-number">${roll.number.toLocaleString()}</div>
                        <div class="history-meta">${roll.timestamp} • ${roll.badges.length} ${roll.badges.length === 1 ? 'badge' : 'badges'}</div>
                    </div>
                    <div class="history-ep">+${roll.ep}</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('Clear all data? This cannot be undone.')) {
                gameData = { rolls: [], badgeCollection: {}, totalEP: 0 };
                initializeBadgeCollection();
                saveGameData();
                updateUI();
                document.getElementById('resultSection').style.display = 'none';
            }
        }

        loadGameData();
    </script>
</body>
</html>
